<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Technical Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#131b2e" stroke-width="1"/>
    </pattern>
    <pattern id="subgrid" width="128" height="128" patternUnits="userSpaceOnUse">
      <rect width="128" height="128" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Dark Engineering Slate Background -->
  <rect width="512" height="512" fill="#090d16"/>
  <rect width="512" height="512" fill="url(#grid)"/>
  <rect width="512" height="512" fill="url(#subgrid)"/>

  <!-- Outer Precision Reticle & Calipers -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="20" x2="256" y2="40" stroke="#00f0ff" stroke-width="2"/>
  <line x1="256" y1="472" x2="256" y2="492" stroke="#64748b" stroke-width="1.5"/>
  <line x1="20" y1="256" x2="40" y2="256" stroke="#64748b" stroke-width="1.5"/>
  <line x1="472" y1="256" x2="492" y2="256" stroke="#00f0ff" stroke-width="2"/>

  <!-- Precision Corner Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.6">
    <path d="M 40 40 L 56 40 M 40 40 L 40 56"/>
    <path d="M 472 40 L 456 40 M 472 40 L 472 56"/>
    <path d="M 40 472 L 56 472 M 40 472 L 40 456"/>
    <path d="M 472 472 L 456 472 M 472 472 L 472 456"/>
  </g>

  <!-- Optical Projection Guides (Euler Planes & Ray Vector) -->
  <g stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3">
    <!-- Horizontal & Vertical Centerlines -->
    <line x1="64" y1="256" x2="448" y2="256"/>
    <line x1="256" y1="64" x2="256" y2="448"/>
    <!-- 45° Reflector Ray Tangents -->
    <line x1="160" y1="352" x2="352" y2="160"/>
    <line x1="160" y1="160" x2="352" y2="352"/>
  </g>

  <!-- Focal Nodes (Acoustic Radiation Radiation Center) -->
  <circle cx="348" cy="144" r="18" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
  <circle cx="348" cy="144" r="32" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="348" cy="144" r="4" fill="#00f0ff"/>

  <!-- MAIN EMBLEM: The KHORA Kinematic-Optical "K" -->
  <!-- Vertical Optical Substrate Plane -->
  <line x1="164" y1="120" x2="164" y2="392" stroke="#f8fafc" stroke-width="16" stroke-linecap="round"/>

  <!-- Upper Incident Ray Vector (Reflecting into traversable focal point) -->
  <line x1="190" y1="266" x2="338" y2="152" stroke="#00f0ff" stroke-width="14" stroke-linecap="round"/>

  <!-- Lower Kinematic Ground Vector (Motor / Joint Base Axis) -->
  <line x1="252" y1="218" x2="348" y2="392" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>

  <!-- Hardware Anchor Nodes -->
  <circle cx="164" cy="120" r="4.5" fill="#090d16" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="164" cy="392" r="4.5" fill="#090d16" stroke="#f8fafc" stroke-width="2"/>
  <circle cx="348" cy="392" r="4.5" fill="#090d16" stroke="#f8fafc" stroke-width="2"/>

  <!-- Coordinate Readout Badges (Authentic Human Engineering Detail) -->
  <text x="164" y="420" font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1.5">AXIS-0: 0.000</text>
  <text x="348" y="420" font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle" letter-spacing="1.5">DOF-6: 1.000</text>
  <text x="372" y="148" font-family="'JetBrains Mono', 'SF Mono', 'Segoe UI Mono', monospace" font-size="10" fill="#38bdf8" letter-spacing="1.5">F_AIP</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background & Ambient Radial Glows (Modern Linear / Vercel aesthetic) -->
    <radialGradient id="ambient-cyan" cx="20%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambient-blue" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070a12" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Linear Gradients for Geometry -->
    <linearGradient id="spine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ray-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>

  <!-- Canvas Base -->
  <rect width="1200" height="420" fill="#080b12"/>
  <rect width="1200" height="420" fill="url(#ambient-cyan)"/>
  <rect width="1200" height="420" fill="url(#ambient-blue)"/>

  <!-- Sleek Outer Border (1px hairline) -->
  <rect x="20" y="20" width="1160" height="380" rx="8" fill="none" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Subtle Precision Corner Bracket Crosshairs -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.6">
    <path d="M 28 40 L 28 28 L 40 28"/>
    <path d="M 1172 40 L 1172 28 L 1160 28"/>
    <path d="M 28 380 L 28 392 L 40 392"/>
    <path d="M 1172 380 L 1172 392 L 1160 392"/>
  </g>

  <!-- ==================================================================== -->
  <!-- LEFT: CLEAN, HIGH-TRUST OPTION C EMBLEM (260x260 px)                -->
  <!-- ==================================================================== -->
  <g transform="translate(85, 80)">
    <!-- Precision Blueprint Outer Box with Rounded Corners -->
    <rect x="0" y="0" width="260" height="260" rx="6" fill="#0c101a" stroke="#223049" stroke-width="1.5"/>
    <rect x="8" y="8" width="244" height="244" rx="4" fill="none" stroke="#152033" stroke-width="1"/>

    <!-- Caliper Ruler Ticks -->
    <g stroke="#475569" stroke-width="1">
      <line x1="65" y1="0" x2="65" y2="8"/><line x1="130" y1="0" x2="130" y2="12"/><line x1="195" y1="0" x2="195" y2="8"/>
      <line x1="65" y1="252" x2="65" y2="260"/><line x1="130" y1="248" x2="130" y2="260"/><line x1="195" y1="252" x2="195" y2="260"/>
      <line x1="0" y1="65" x2="8" y2="65"/><line x1="0" y1="130" x2="12" y2="130"/><line x1="0" y1="195" x2="8" y1="195"/>
      <line x1="252" y1="65" x2="260" y2="65"/><line x1="248" y1="130" x2="260" y2="130"/><line x1="252" y1="195" x2="260" y2="195"/>
    </g>

    <!-- 45-Degree Internal Optical Alignment Diagonal -->
    <line x1="24" y1="236" x2="236" y2="24" stroke="#162236" stroke-width="1.2" stroke-dasharray="3 4"/>

    <!-- OPTION C GLYPH (Pure Vector Polish) -->
    <!-- Physical Datum Spine (Solid + Guide Rail) -->
    <line x1="72" y1="42" x2="72" y2="218" stroke="url(#spine-grad)" stroke-width="14" stroke-linecap="round"/>
    <line x1="88" y1="56" x2="88" y2="204" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3 4" opacity="0.8"/>

    <!-- Upper Traversable Ray (Free Space Convergence) -->
    <line x1="114" y1="116" x2="198" y2="42" stroke="url(#ray-grad)" stroke-width="14" stroke-linecap="round"/>

    <!-- Acoustic Wavefront Shock Arcs (40 kHz Radiation Node) -->
    <path d="M 172 32 A 28 28 0 0 1 212 72" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="3 3"/>
    <path d="M 160 20 A 48 48 0 0 1 224 84" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.5"/>

    <!-- Lower Kinematic Ground Vector -->
    <line x1="114" y1="144" x2="198" y2="218" stroke="url(#spine-grad)" stroke-width="14" stroke-linecap="round"/>

    <!-- The 120mm Open-Air Clearance Aperture Ring -->
    <circle cx="102" cy="130" r="7" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="102" cy="130" r="2.5" fill="#00f0ff"/>

    <!-- Annotations -->
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00f0ff" font-weight="700" letter-spacing="1.5">KHORA // SPEC-C</text>
    <text x="246" y="248" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" text-anchor="end" letter-spacing="1">120mm AIR GAP</text>
  </g>

  <!-- ==================================================================== -->
  <!-- RIGHT: TRUST-FOCUSED TYPOGRAPHY & FLAGSHIP SPECIFICATIONS            -->
  <!-- ==================================================================== -->

  <!-- Top Metadata Bar -->
  <g transform="translate(390, 82)">
    <rect x="0" y="0" width="200" height="24" rx="12" fill="#0d1422" stroke="#1e2c44" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#3fb950"/>
    <text x="24" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" letter-spacing="1.5">
      OPEN-SOURCE FOUNDATION
    </text>

    <text x="730" y="16" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="2">
      RFC-0001 · RFC-0002
    </text>
  </g>

  <!-- BRAND WORDMARK -->
  <text x="386" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, sans-serif" font-weight="800" font-size="74" fill="#ffffff" letter-spacing="10">
    KHORA
  </text>

  <!-- Subtitle (Clear, Inspiring, High-Trust) -->
  <text x="390" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-weight="600" font-size="17" fill="#38bdf8" letter-spacing="0.5">
    Traversable Spatial Light, 40 kHz Mid-Air Haptics &amp; Deterministic Robotics
  </text>

  <!-- Descriptive Pitch -->
  <text x="390" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.2">
    The open engineering ecosystem uniting non-deterministic AI agents with hard real-time physical actuators
  </text>
  <text x="390" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.2">
    and floating 1:1 real holographic images. Zero headsets, zero wearables, 100% offline determinism.
  </text>

  <!-- TRUST PILLS / BADGES (Modern GitHub / Linear style) -->
  <g transform="translate(390, 280)">
    <!-- Pill 1: MIT License -->
    <rect x="0" y="0" width="125" height="32" rx="16" fill="#0f1626" stroke="#22324d" stroke-width="1"/>
    <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#3fb950">✓</text>
    <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">MIT License</text>

    <!-- Pill 2: 1:1 DCRA Optics -->
    <rect x="135" y="0" width="170" height="32" rx="16" fill="#0f1626" stroke="#22324d" stroke-width="1"/>
    <text x="149" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#00f0ff">✓</text>
    <text x="165" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">1:1 DCRA Convergence</text>

    <!-- Pill 3: 40kHz Haptics -->
    <rect x="315" y="0" width="160" height="32" rx="16" fill="#0f1626" stroke="#22324d" stroke-width="1"/>
    <text x="329" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">✓</text>
    <text x="345" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">40 kHz Acoustic Touch</text>

    <!-- Pill 4: Model Context Protocol -->
    <rect x="485" y="0" width="165" height="32" rx="16" fill="#0f1626" stroke="#22324d" stroke-width="1"/>
    <text x="499" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a78bfa">✓</text>
    <text x="515" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#f1f5f9">Model Context Protocol</text>
  </g>

  <!-- Bottom Telemetry Divider & Metrics -->
  <line x1="390" y1="335" x2="1120" y2="335" stroke="#1a2538" stroke-width="1"/>
  <text x="390" y="352" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1.5">
    5-15 mN RADIATION PRESSURE · 250 Hz S-CURVE KINEMATICS · 50ms HARDWARE WATCHDOG
  </text>
  <text x="1120" y="352" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="end" font-weight="bold" letter-spacing="1">
    github.com/iriss-dev/khora
  </text>
</svg>

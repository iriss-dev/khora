<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Ultra-subtle engineering grid -->
    <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e2430"/>
    </pattern>
    <pattern id="caliper-strip" width="10" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#242e42" stroke-width="1"/>
      <line x1="10" y1="0" x2="10" y2="20" stroke="#3b4b66" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Technical Void -->
  <rect width="1200" height="420" fill="#080a0f"/>
  <rect width="1200" height="420" fill="url(#dot-grid)"/>

  <!-- Top & Bottom Aerospace Caliper Rulers -->
  <rect x="0" y="0" width="1200" height="12" fill="#0d111a"/>
  <rect x="0" y="0" width="1200" height="12" fill="url(#caliper-strip)"/>
  <line x1="0" y1="12" x2="1200" y2="12" stroke="#1f293d" stroke-width="1"/>

  <rect x="0" y="408" width="1200" height="12" fill="#0d111a"/>
  <rect x="0" y="408" width="1200" height="12" fill="url(#caliper-strip)"/>
  <line x1="0" y1="408" x2="1200" y2="408" stroke="#1f293d" stroke-width="1"/>

  <!-- Precision Corner Crosshairs (CERN / Skunk Works style) -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.8">
    <path d="M 30 30 L 50 30 M 30 30 L 30 50"/>
    <path d="M 1170 30 L 1150 30 M 1170 30 L 1170 50"/>
    <path d="M 30 390 L 50 390 M 30 390 L 30 370"/>
    <path d="M 1170 390 L 1150 390 M 1170 390 L 1170 370"/>
  </g>

  <!-- Massive Background Coordinate Vector slicing diagonally at 45° -->
  <line x1="0" y1="420" x2="420" y2="0" stroke="#131c2c" stroke-width="2"/>
  <line x1="150" y1="420" x2="570" y2="0" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="6 12" opacity="0.3"/>
  <line x1="850" y1="420" x2="1270" y2="0" stroke="#131c2c" stroke-width="1.5" stroke-dasharray="4 8"/>

  <!-- ==================================================================== -->
  <!-- LEFT: MONUMENTAL OPTION C HERO GLYPH (Pure Mathematical Power)      -->
  <!-- ==================================================================== -->
  <g transform="translate(60, 48)">
    <!-- Precision Drafting Outer Boundary -->
    <rect x="0" y="0" width="310" height="310" fill="#0b0e17" stroke="#1f2d45" stroke-width="1.5"/>
    <rect x="10" y="10" width="290" height="290" fill="none" stroke="#131d2e" stroke-width="1"/>

    <!-- Caliper Tick Marks -->
    <g stroke="#475569" stroke-width="1">
      <line x1="77" y1="0" x2="77" y2="10"/><line x1="155" y1="0" x2="155" y2="16"/><line x1="232" y1="0" x2="232" y2="10"/>
      <line x1="77" y1="300" x2="77" y2="310"/><line x1="155" y1="294" x2="155" y2="310"/><line x1="232" y1="300" x2="232" y2="310"/>
      <line x1="0" y1="77" x2="10" y2="77"/><line x1="0" y1="155" x2="16" y2="155"/><line x1="0" y1="232" x2="10" y2="232"/>
      <line x1="300" y1="77" x2="310" y2="77"/><line x1="294" y1="155" x2="310" y2="155"/><line x1="300" y1="232" x2="310" y2="232"/>
    </g>

    <!-- 45-Degree Internal Optical Projection Line -->
    <line x1="30" y1="280" x2="280" y2="30" stroke="#182338" stroke-width="1.5" stroke-dasharray="3 4"/>

    <!-- THE OPTION C GLYPH (Monumental Titanium White & Cyan) -->
    <!-- Vertical Physical Substrate (Dual Solid + Parallel Guide) -->
    <line x1="84" y1="46" x2="84" y2="264" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
    <line x1="102" y1="60" x2="102" y2="250" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4 4"/>

    <!-- Upper Traversable Ray (Shooting into free space) -->
    <line x1="134" y1="138" x2="236" y2="46" stroke="#00f0ff" stroke-width="16" stroke-linecap="round"/>

    <!-- Concentric Acoustic Shockwave Arcs (40 kHz Radiation Pressure) -->
    <path d="M 204 32 A 36 36 0 0 1 254 82" fill="none" stroke="#00f0ff" stroke-width="3" stroke-dasharray="4 4"/>
    <path d="M 190 18 A 60 60 0 0 1 268 96" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.7"/>
    <path d="M 176 4 A 84 84 0 0 1 282 110" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2 8" opacity="0.35"/>

    <!-- Lower Kinematic Ground Vector -->
    <line x1="134" y1="172" x2="236" y2="264" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>

    <!-- The 120mm Open-Air Clearance Aperture Ring -->
    <circle cx="118" cy="155" r="8" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <circle cx="118" cy="155" r="3" fill="#00f0ff"/>

    <!-- Caliper Footprint Annotations -->
    <text x="14" y="24" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" fill="#00f0ff" font-weight="700" letter-spacing="2">KHORA // C-01</text>
    <text x="296" y="298" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" fill="#64748b" text-anchor="end" letter-spacing="1.5">OPEN AIR GAP: 120mm</text>
  </g>

  <!-- ==================================================================== -->
  <!-- CENTER/RIGHT: COMMANDING TYPOGRAPHY & BRUTALIST ARCHITECTURE         -->
  <!-- ==================================================================== -->
  
  <!-- Protocol & Clearance Readout Bar -->
  <g transform="translate(420, 52)">
    <rect x="0" y="0" width="720" height="26" fill="#0c111a" stroke="#1d273a" stroke-width="1"/>
    <circle cx="12" cy="13" r="3.5" fill="#00f0ff"/>
    <text x="24" y="17" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#00f0ff" letter-spacing="2.5">
      CORE ARCHITECTURE // RFC-0001 &amp; RFC-0002
    </text>
    <text x="708" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="end" letter-spacing="3">
      AIR-GAPPED DETERMINISTIC PLANE
    </text>
  </g>

  <!-- MONUMENTAL KHORA WORDMARK -->
  <text x="416" y="162" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#ffffff" letter-spacing="22">KHORA</text>

  <!-- Authoritative Engineering Manifesto Line -->
  <text x="420" y="204" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="14" font-weight="800" fill="#00f0ff" letter-spacing="5">
    TRAVERSABLE SPATIAL LIGHT &amp; DETERMINISTIC ROBOTICS
  </text>

  <!-- Deep Technical Spec Descriptor -->
  <text x="420" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#cbd5e1" letter-spacing="0.3">
    Global open-source platform uniting non-deterministic AI agents with hard real-time kinematics
  </text>
  <text x="420" y="258" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.3">
    and mid-air tactile holography. Pure optical physics. Zero wearables. 100% offline determinism.
  </text>

  <!-- HARDWARE & PROTOCOL SPECIFICATION BADGES -->
  <g transform="translate(420, 284)">
    <!-- Badge 1: DCRA -->
    <rect x="0" y="0" width="168" height="42" fill="#0c121e" stroke="#1f2d42" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="3" y2="42" stroke="#00f0ff" stroke-width="3"/>
    <text x="14" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" font-weight="700" letter-spacing="1.5">OPTICAL CONVERGENCE</text>
    <text x="14" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="700">DCRA 1:1 AIR</text>

    <!-- Badge 2: Ultrasound -->
    <rect x="180" y="0" width="168" height="42" fill="#0c121e" stroke="#1f2d42" stroke-width="1.2"/>
    <line x1="180" y1="0" x2="183" y2="42" stroke="#38bdf8" stroke-width="3"/>
    <text x="194" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" font-weight="700" letter-spacing="1.5">MID-AIR HAPTICS</text>
    <text x="194" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="700">40kHz 5-15mN</text>

    <!-- Badge 3: Kinematics -->
    <rect x="360" y="0" width="168" height="42" fill="#0c121e" stroke="#1f2d42" stroke-width="1.2"/>
    <line x1="360" y1="0" x2="363" y2="42" stroke="#a78bfa" stroke-width="3"/>
    <text x="374" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" font-weight="700" letter-spacing="1.5">KINEMATIC CONTROL</text>
    <text x="374" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ffffff" font-weight="700">SE(3) DLS 250Hz</text>

    <!-- Badge 4: Watchdog -->
    <rect x="540" y="0" width="176" height="42" fill="#0c121e" stroke="#1f2d42" stroke-width="1.2"/>
    <line x1="540" y1="0" x2="543" y2="42" stroke="#4ade80" stroke-width="3"/>
    <text x="554" y="17" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b" font-weight="700" letter-spacing="1.5">FAIL-SAFE INTERLOCK</text>
    <text x="554" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80" font-weight="700">50ms WATCHDOG</text>
  </g>

  <!-- Technical Telemetry Equation Footer -->
  <g transform="translate(420, 345)">
    <line x1="0" y1="0" x2="720" y2="0" stroke="#182338" stroke-width="1"/>
    <text x="0" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="2">
      d_air = d_source // v_r = [-v_x, -v_y, v_z] // P_rad = 2&lt;I&gt;/c // w = √(det(J J^T))
    </text>
    <text x="720" y="18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff" text-anchor="end" font-weight="bold" letter-spacing="2">
      v0.1.0-alpha
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Obsidian Technical Workspace -->
  <rect width="512" height="512" fill="#0b0e14"/>

  <!-- Precision Millimeter Calipers (Outer Border) -->
  <rect x="28" y="28" width="456" height="456" fill="none" stroke="#1a2333" stroke-width="1.2"/>
  
  <!-- Caliper Sub-divisions & Metric Precision Ticks -->
  <g stroke="#334155" stroke-width="1">
    <!-- Top & Bottom Ruler Ticks -->
    <line x1="128" y1="28" x2="128" y2="38"/><line x1="256" y1="28" x2="256" y2="44"/><line x1="384" y1="28" x2="384" y2="38"/>
    <line x1="128" y1="474" x2="128" y2="484"/><line x1="256" y1="468" x2="256" y2="484"/><line x1="384" y1="474" x2="384" y2="484"/>
    <!-- Left & Right Ruler Ticks -->
    <line x1="28" y1="128" x2="38" y2="128"/><line x1="28" y1="256" x2="44" y2="256"/><line x1="28" y1="384" x2="38" y2="384"/>
    <line x1="474" y1="128" x2="484" y2="128"/><line x1="468" y1="256" x2="484" y2="256"/><line x1="474" y1="384" x2="484" y2="384"/>
  </g>

  <!-- 45 Degree Orthogonal Projection Line (Dihedral Substrate Angle) -->
  <line x1="96" y1="416" x2="416" y2="96" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/>
  
  <!-- THE OFFICIAL KHORA TRAVERSABLE GLYPH -->
  <!-- Left Optical Plane Guide: Dual Parallel Solid/Dashed Spine -->
  <line x1="168" y1="128" x2="168" y2="384" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>
  <line x1="188" y1="144" x2="188" y2="368" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Upper Optical Trajectory: Originates across traversable air gap -->
  <line x1="220" y1="236" x2="344" y2="128" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Mid-Air Acoustic Wavefront Arcs at Focal Spot -->
  <path d="M 310 110 A 30 30 0 0 1 360 160" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3 3"/>
  <path d="M 296 96 A 50 50 0 0 1 376 176" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Lower Kinematic Ground Vector (Motor / Joint Base Axis) -->
  <line x1="220" y1="276" x2="344" y2="384" stroke="#f1f5f9" stroke-width="14" stroke-linecap="round"/>

  <!-- Traversable Open Air Marker (Physical clearance notation) -->
  <circle cx="204" cy="256" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="204" cy="256" r="2" fill="#38bdf8"/>

  <!-- Engineering Labels -->
  <text x="44" y="52" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" fill="#64748b" letter-spacing="1.5">KHORA // SPEC-01</text>
  <text x="468" y="468" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" fill="#64748b" text-anchor="end" letter-spacing="1.5">OPEN AIR GAP: 120mm</text>
</svg>

name: Validate
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  numerical-and-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_platform.cjs
      - run: cmake -S firmware -B build/firmware
      - run: cmake --build build/firmware
      - run: ctest --test-dir build/firmware --output-on-failure
      - run: cargo test --manifest-path crates/khora-core/Cargo.toml
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
        env:
          KHORA_BROWSER_CHANNEL: chromium
      - run: node tests/landing_smoke.cjs
        env:
          KHORA_BROWSER_CHANNEL: chromium
  pico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: git clone --depth 1 --branch 2.2.0 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$RUNNER_TEMP/pico-sdk"
      - run: cmake -S firmware/rp2040 -B build/pico -DPICO_BOARD=pico
        env:
          PICO_SDK_PATH: ${{ runner.temp }}/pico-sdk
      - run: cmake --build build/pico --parallel 2
      - uses: actions/upload-artifact@v4
        with:
          name: khora-pico-dry-run
          path: build/pico/khora_pico.uf2

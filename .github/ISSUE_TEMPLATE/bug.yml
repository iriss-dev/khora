name: Bug report
description: Report a numerical, browser, or transport problem.
title: "[Bug] "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a lab configuration link or minimal example.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, or toolchain version.
